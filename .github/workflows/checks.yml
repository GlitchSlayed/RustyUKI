name: checks

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fedora-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ['44', '45']
    container:
      # Targets latest 2 Fedora releases
      image: fedora:${{ matrix.fedora_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install check dependencies
        run: |
          dnf install -y \
            bash \
            cargo \
            clippy \
            gcc \
            coreutils \
            diffutils \
            findutils \
            grep \
            rust \
            rustfmt \
            sed \
            util-linux \
            which \
            shellcheck \
            git

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Cache Cargo registry and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-checks-fc${{ matrix.fedora_version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-checks-fc${{ matrix.fedora_version }}-

      - name: Rust unit/integration tests
        run: |
          if [[ -f Cargo.lock ]]; then
            cargo test --all-targets --locked
          else
            cargo test --all-targets
          fi

      - name: Rust Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust compile check
        run: |
          if [[ -f Cargo.lock ]]; then
            cargo check --all-targets --locked
          else
            cargo check --all-targets
          fi

      - name: Rust build
        run: |
          if [[ -f Cargo.lock ]]; then
            cargo build --all-targets --locked
          else
            cargo build --all-targets
          fi
