name: Fedora Build & Packaging

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Force a build even when no commits were added since the last RPM release
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rpm-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ['44', '45']
    container:
      image: fedora:${{ matrix.fedora_version }}

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            git \
            rpm-build \
            rpmdevtools \
            cargo \
            rust \
            systemd-rpm-macros

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Mark workspace as a safe Git directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-rpm-fc${{ matrix.fedora_version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rpm-fc${{ matrix.fedora_version }}-

      - name: Build SRPM/RPM
        run: |
          set -euo pipefail

          version="$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
          topdir="$(rpm --eval '%{_topdir}')"

          rpmdev-setuptree

          archive_dir="rustyuki-${version}"
          tarball="${archive_dir}.tar.gz"

          git archive --format=tar.gz --prefix="${archive_dir}/" -o "${topdir}/SOURCES/${tarball}" HEAD
          cp .github/rpm/rustyuki.spec "${topdir}/SPECS/rustyuki.spec"
          sed -i "s/^Version:.*/Version:        ${version}/" "${topdir}/SPECS/rustyuki.spec"

          rpmbuild -ba "${topdir}/SPECS/rustyuki.spec"

          mkdir -p dist
          find "${topdir}/RPMS" -type f -name '*.rpm' -exec cp {} dist/ \;
          find "${topdir}/SRPMS" -type f -name '*.src.rpm' -exec cp {} dist/ \;

      - name: Smoke test installed RPM
        run: |
          dnf install -y dist/rustyuki-*.x86_64.rpm
          rustyuki --version
          test -f /usr/lib/kernel/install.d/90-rustyuki.install
          test -f /etc/rustyuki/config.toml
          test -f /usr/lib/systemd/system/rustyuki-boot-confirm.service

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ matrix.fedora_version }}-rpm-ci-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

  plan-release:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      reason: ${{ steps.plan.outputs.reason }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      latest_tag: ${{ steps.plan.outputs.latest_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether a build is needed
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
        run: |
          set -euo pipefail

          latest_tag="$(gh api repos/${GITHUB_REPOSITORY}/releases --jq '[.[] | select(.tag_name | startswith("rpm-nightly-"))][0].tag_name' 2>/dev/null || true)"
          head_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"

          should_build=false
          reason=""

          if [[ "${EVENT_NAME}" == "push" ]]; then
            should_build=true
            reason="new commit ${short_sha} pushed to ${GITHUB_REF_NAME}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${FORCE_BUILD}" == "true" ]]; then
            should_build=true
            reason="manual force build"
          elif [[ -z "${latest_tag}" || "${latest_tag}" == "null" ]]; then
            should_build=true
            reason="no previous rpm-nightly release"
          else
            last_sha="$(git rev-list -n 1 "${latest_tag}" 2>/dev/null || true)"
            if [[ -z "${last_sha}" || "${head_sha}" != "${last_sha}" ]]; then
              should_build=true
              reason="new commits since ${latest_tag}"
            else
              reason="no new commits since ${latest_tag}"
            fi
          fi

          release_tag="rpm-nightly-$(date -u +%Y%m%d)-${short_sha}"

          {
            echo "latest_tag=${latest_tag}"
            echo "head_sha=${head_sha}"
            echo "should_build=${should_build}"
            echo "reason=${reason}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

          echo "Build decision: ${should_build} (${reason})"
          echo "Target release tag: ${release_tag}"

  build-release-rpms:
    needs: plan-release
    if: needs.plan-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ['44', '45']
    container:
      image: fedora:${{ matrix.fedora_version }}

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            git \
            rpm-build \
            rpmdevtools \
            cargo \
            rust \
            systemd-rpm-macros

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan-release.outputs.head_sha }}

      - name: Mark workspace as a safe Git directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-fc${{ matrix.fedora_version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-fc${{ matrix.fedora_version }}-

      - name: Build SRPM/RPM using Fedora rpm macros
        run: |
          set -euo pipefail

          version="$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)"
          topdir="$(rpm --eval '%{_topdir}')"

          rpmdev-setuptree

          archive_dir="rustyuki-${version}"
          tarball="${archive_dir}.tar.gz"

          git archive --format=tar.gz --prefix="${archive_dir}/" -o "${topdir}/SOURCES/${tarball}" HEAD
          cp .github/rpm/rustyuki.spec "${topdir}/SPECS/rustyuki.spec"

          sed -i "s/^Version:.*/Version:        ${version}/" "${topdir}/SPECS/rustyuki.spec"

          rpmbuild -ba "${topdir}/SPECS/rustyuki.spec"

          mkdir -p dist
          find "${topdir}/RPMS" -type f -name '*.rpm' -exec cp {} dist/ \;
          find "${topdir}/SRPMS" -type f -name '*.src.rpm' -exec cp {} dist/ \;

      - name: Smoke test installed RPM
        run: |
          dnf install -y dist/rustyuki-*.x86_64.rpm
          rustyuki --version
          test -f /usr/lib/kernel/install.d/90-rustyuki.install
          test -f /etc/rustyuki/config.toml
          test -f /usr/lib/systemd/system/rustyuki-boot-confirm.service

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ matrix.fedora_version }}-rpm-${{ needs.plan-release.outputs.release_tag }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: [plan-release, build-release-rpms]
    if: needs.plan-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all built RPM artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-all
          merge-multiple: true

      - name: List downloaded packages
        run: ls -la dist-all/

      - name: Create GitHub release for RPMs
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.plan-release.outputs.release_tag }}
          target_commitish: ${{ needs.plan-release.outputs.head_sha }}
          name: Fedora RPM build ${{ needs.plan-release.outputs.release_tag }}
          generate_release_notes: true
          make_latest: true
          files: dist-all/*
          body: |
            Automated Fedora RPM nightly build targeting Fedora 44 and Fedora 45.

            - Trigger: `${{ github.event_name }}`
            - Reason: `${{ needs.plan-release.outputs.reason }}`
            - Commit: `${{ needs.plan-release.outputs.head_sha }}`
            - Previous RPM tag: `${{ needs.plan-release.outputs.latest_tag || 'none' }}`
            - Target Releases: Fedora 44 (`.fc44`), Fedora 45 (`.fc45`)
